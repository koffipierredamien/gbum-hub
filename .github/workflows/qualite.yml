name: Qualité

# Le dépôt d'origine n'avait aucune intégration continue : rien n'y empêchait
# une régression d'entrer. Ici, ces contrôles sont BLOQUANTS.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verifier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typage strict
        run: pnpm -r types
      - name: Linter — zéro avertissement toléré
        run: pnpm lint --max-warnings 0
      - name: Tests, dont l'audit IDOR génératif
        run: pnpm -r test
